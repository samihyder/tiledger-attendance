{% extends 'base.html' %}
{% block title %}Page Not Found — TiLedger{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-muted opacity-25">404</div>
  <h4 class="mt-2 mb-1 fw-bold">Page Not Found</h4>
  <p class="text-muted mb-4">{{ message or 'The page you are looking for does not exist.' }}</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
    <i class="bi bi-house me-2"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
